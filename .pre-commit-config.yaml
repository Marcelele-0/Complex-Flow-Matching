repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: detect-private-key

  # Pinned to the version the project itself resolves (pyproject: ruff>=0.16.5).
  # These drifted before: the hook sat at v0.6.9 while the project used 0.16.5, and
  # the two disagreed on the layout of one assert in scripts/bridge_angular_velocity.py
  # and one in tests/test_data/test_build_dataset.py, so both files flipped back and
  # forth depending on who ran the formatter last.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Run through uv rather than mirrors-mypy. The mirror installs mypy into its own
  # isolated environment without the project's dependencies, so it saw DictConfig and
  # every torch type as Any and checked almost nothing. This hook sees what CI sees.
  #
  # scripts/ is included: it holds the paper's network-free probes, and it was not
  # covered, which is how scripts/coupling_gate.py -- the Table 4 measurement -- kept
  # an import that had been moved out from under it. tests/ is deliberately left out;
  # it builds ill-typed doubles on purpose, and making those type-check would make
  # them worse tests.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project environment)
        entry: uv run mypy src/ scripts/ reproducibility/
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v2.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
