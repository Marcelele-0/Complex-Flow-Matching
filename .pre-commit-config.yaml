repos:
  - repo: local
    hooks:
      - id: jupytext-pre
        name: Jupytext generate .py from .ipynb
        entry: bash -c 'find notebooks -name "*.ipynb" -exec uv run jupytext --sync {} +'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        exclude: ^notebooks/

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v2.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: jupytext-post
        name: Jupytext sync .py back to .ipynb
        entry: bash -c 'find notebooks -name "*.py" -exec uv run jupytext --sync {} +'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
