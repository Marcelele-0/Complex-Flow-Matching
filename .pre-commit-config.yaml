repos:
  - repo: local
    hooks:
      - id: jupytext-pre
        name: Jupytext generate .py from .ipynb
        entry: bash -c 'find notebooks -name "*.ipynb" -exec uv run jupytext --sync {} +'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: jupytext-post
        name: Jupytext sync .py back to .ipynb
        entry: bash -c 'find notebooks -name "*.py" -exec uv run jupytext --sync {} +'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
