# Full fastMRI multi-coil cohort, for cluster runs. Mirrors fastmri_local apart
# from the data location and the absent volume cap.
name: "fastmri"
data_dir: "/net/tscratch/people/plgmarcel/fastmri_full"
num_slices: 1
acceleration: 4
mask:
  type: "poisson_disc"
  acceleration: 4

# See fastmri_local.yaml: the cohort has no single matrix size, so this is what
# makes batches collatable, and it removes the 2x readout oversampling.
crop_size: [320, 320]

# No cap: the whole cohort. The index scan opens and closes one file at a time,
# so thousands of volumes do not exhaust the file descriptor limit, but the first
# cold start still walks every header - leave use_cache on.
max_volumes: ~

# Directory of sidecar HDF5 files holding the ESPIRiT maps. Strongly preferred at
# this scale over letting scripts/prep_fastmri_espirit.py write into the archive:
# the maps are the same size as the k-space, so in-place writing roughly doubles
# the footprint of the source dataset.
sens_dir: "/net/tscratch/people/plgmarcel/fastmri_full_sens"

use_cache: true
cache_dir: ".cache"

# fastMRI ships no annotations/ manifests, so there is no split to gate on. This
# also tells evaluate.py not to look for one; hold data out by directory instead.
split: null
