data_dir: "data/skm-tea-mini/v1-release"
num_slices: 1
acceleration: 4
mask:
  type: "cartesian"
  acceleration: 4
echo_idx: 0
coil_idx: 0
use_cache: true
cache_dir: ".cache"

# Manifest gating training, from {data_dir}/annotations/v1.0.0/{split}.json.
# Must differ from evaluate.split or the scores are on seen data.
# null trains on every .h5 in data_dir (no held-out claim is then possible).
split: train
