data_dir: "data/skm-tea-mini/v1-release"
num_slices: 1
acceleration: 4
mask:
  type: "cartesian"
  acceleration: 4
echo_idx: 0
coil_idx: 0

# Fixed [H, W] output. SKM-TEA volumes already share a matrix size, so null is
# enough here and slices are only cropped to a multiple of 16 for the U-Net.
crop_size: ~

use_cache: true
cache_dir: ".cache"

# Manifest gating training, from {data_dir}/annotations/v1.0.0/{split}.json.
# Must differ from evaluate.split or the scores are on seen data.
# null trains on every .h5 in data_dir (no held-out claim is then possible).
split: train
