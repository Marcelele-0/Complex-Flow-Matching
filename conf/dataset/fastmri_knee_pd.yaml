# fastMRI knee, coronal proton density without fat suppression (CORPD_FBK), read from
# the compact store built by scripts/data/build_knee_pd_store.py.
#
# Why this subset: every volume uses 15 coils and one of two nearly identical
# matrices, so the target distribution is one acquisition on one hardware setup --
# unlike brain AXT2, which mixes eight coil counts. Without fat suppression the
# fat-water chemical shift leaves real structure in the phase, which is what this
# paper is about. It is also the split the score-based-prior literature trains on
# (central slices of CORPD, 320x320, per-field peak normalisation).
name: fastmri_knee_pd

# Directory holding <store> and its .json manifest.
data_dir: "data/knee_pd"
store: "val.h5"

# Volume-level split. Slices of one knee are highly correlated, so the assignment
# hashes the volume id: "fit" trains, "holdout" is never trained on, "all" ignores
# the split. This is the paper's split; dataset.split below is the unrelated
# annotations mechanism the fastMRI cohort has no manifests for.
role: fit
holdout_fraction: 0.2
split_seed: 0

split: null

# The store is already cropped to 320x320 at build time; leaving crop_size null keeps
# the entry points from cropping a second time.
crop_size: null
