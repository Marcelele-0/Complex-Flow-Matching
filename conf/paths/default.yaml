output_dir: ${hydra:runtime.output_dir}
checkpoint_dir: ${paths.output_dir}/checkpoints

# Where train.py writes `last.pt`, the full resume state (weights + optimizer moments
# + LR schedule position). Deliberately NOT under output_dir: that path carries a
# timestamp, so a requeued Slurm job gets a fresh directory and would never find the
# state its previous instance left behind.
#
# Also deliberately outside outputs/train/: resolve_checkpoint() globs that tree for
# the newest .pt, and `last.pt` is a payload dict rather than a bare state dict, so
# evaluate.py would fail on it.
#
# Keyed by experiment_name, which is already this repo's run identity (it names the
# Hydra run dir, the W&B run and evaluate's run_name). Two concurrent runs
# under one experiment_name would fight over the file - give them different names.
state_dir: outputs/state/${logging.experiment_name}
