# Configuration for reconstructing a real slice and comparing side-by-side with ground truth.

# Direct path to a .pt checkpoint file, e.g. "outputs/train/exp_002_hf_boost_0.5/.../checkpoint_epoch_100.pt".
# If null, falls back to searching outputs/train/{run_name}/**/*.pt (or logging.experiment_name).
checkpoint_path: null

# Experiment/run name to resolve checkpoint if checkpoint_path is null.
run_name: null

# Dataset slice to reconstruct (index in SKMTEADataset).
sample_idx: 0

# Which dataset split to select from (null uses all available .h5 in data_dir).
split: null

# Falls back to dataset.data_dir when null.
data_dir: null

# Where on the noise -> data bridge reconstruction starts:
#   0.0 = pure generation initialized from paired cylindrical noise
#   0.5 = half-noised bridge state, model reconstructs the remaining path
t_start: 0.5

# Number of Heun ODE solver steps from t_start to 1.0.
num_steps: 100

# Mask threshold fraction for tissue-only phase error computation.
mask_threshold: 0.05

# Output directory for saved plots (null saves to hydra runtime output_dir or outputs/reconstruction).
output_dir: null

# DPI for saved comparison figures.
dpi: 300

# Random seed for noise reproducibility.
seed: 42
