epochs: 100

# PER GPU under torchrun, so the effective batch is batch_size * world_size and the
# learning rate below is not rescaled for you. Halve it when you double the GPUs if
# you want a run comparable to an existing single-GPU one.
batch_size: 4
num_workers: 4
learning_rate: 2e-4
weight_decay: 1e-4

matmul_precision: "high"

# Which distribution the probability path starts from at t=0.
#
#   noise    x_0 ~ manifold.sample_noise(...). The model is an unconditional prior:
#            it learns the data distribution and never sees a measurement. This is
#            what the synthesis track needs.
#   aliased  x_0 = the zero-filled reconstruction of the undersampled slice, x_1 the
#            fully sampled one. The model learns to remove aliasing, which is the
#            task evaluate.py actually asks of it.
#
# `noise` was the only behaviour before this key existed, and remains the default so
# the synthesis runs are unaffected.
#
# Why `aliased` exists: evaluate.py warm-starts from the aliased image
# (`bridge(x_0, x_alias, t_start)`) while `noise` training only ever builds states as
# `bridge(x_0, x_clean, t)`. The velocity field is then queried off its training
# distribution, and the measured consequence is that both geometries score below a
# plain zero-filled reconstruction. Setting this to `aliased` makes the two agree.
#
# Requires dataset.num_slices=1: the dataset's reconstruction mode is single-slice
# only, so 2.5D windows cannot use this path.
bridge: "noise"

# Continue from paths.state_dir/last.pt when that file exists, instead of starting at
# epoch 0. Off by default because it makes a rerun under an existing experiment_name
# silently continue rather than restart - the SLURM scripts turn it on, since there a
# restart is the scheduler's decision rather than the user's.
auto_resume: false

# Path the training loop watches for a "wrap up now" flag, checked at the end of each
# epoch. scripts/slurm/train_ddp.sbatch sets it and touches the file when Slurm warns
# that the wall clock is close, so the run saves its resume state and exits instead of
# being killed mid-epoch. A signal cannot do this job: it does not survive the relay
# through srun, uv and the torchrun agent. null outside a batch job.
preempt_file: null

# Seeds weight init, batch order, noise and time sampling. Set to null for an
# unseeded run.
#
# One seed also puts BOTH manifolds on element-wise identical weights everywhere
# except init_conv - the single module whose shape depends on the geometry, built
# last so it cannot shift the RNG for anything else. Initialisation is therefore
# not a confound. Data order, noise and time sampling still vary with the seed,
# so run several seeds per arm and report the spread.
seed: 0

# Max gradient norm, or null to disable clipping.
#
# NOT scale-invariant. The two losses differ ~4x in magnitude (the cylindrical
# total carries an O(pi) angular term), and AdamW is otherwise scale-invariant,
# so clipping is the one place that difference affects training. It only matters
# when the threshold binds for one arm and not the other: measured here, both
# arms clip at 1.0 early on, but the Euclidean gradients fall below it first.
#
# Set to null for a comparison run, or check the logged `grad_norm` for both arms
# before publishing a table.
grad_clip: 1.0

# torch.compile the model before training. Worth the one-off Triton compile on a
# GPU; set false for CPU smoke runs, where it costs a minute and buys nothing.
compile: true

# One loss block serves both geometries. Each manifold reads the keys that apply
# to it and ignores the rest, so `training.loss.*` overrides keep working
# unchanged across the manifold switch.
# Which prior sample is paired with which datum before the bridge runs.
#   independent  Whatever the dataloader drew together. Plain flow matching, and
#                the baseline every coupling claim is measured against.
#   ot           Exact minibatch optimal transport in the manifold's own metric,
#                one joint assignment over the batch. Requires bridge=noise and
#                num_slices=1; see cfm.flow.coupling for why no factorised
#                variant is offered.
coupling: "independent"

loss:
  # --- cylindrical only ---
  amp_loss_type: "l1"
  phase_loss_type: "l1"
  lambda_phase: 1.0
  # Weight the phase error by the clean amplitude A_1 / mean(A_1). The Euclidean
  # arm has no counterpart, and the weight depends on x_1, so the phase channel
  # regresses a reweighted conditional statistic the amplitude channel does not.
  # false is the unweighted loss, kept as a one-flag ablation.
  phase_amplitude_weighting: true

  # --- euclidean only ---
  # Velocity loss over (v_re, v_im). "l1" matches the cylindrical method, so
  # neither arm of the comparison is penalised for a metric choice the other did
  # not make; "l2"/"mse" is the conventional flow-matching alternative, kept as a
  # one-flag ablation.
  vel_loss_type: "l1"

  # --- both geometries ---
  # High-frequency k-space boost weight (disabled by default).
  # NOTE: the FFT uses norm="ortho", which divides magnitudes by sqrt(H*W).
  # Values tuned before the ortho change must be multiplied by sqrt(H*W)
  # (512 at the native 512x512 resolution) to keep the same effective weight.
  lambda_hf: 0.0
  hf_boost_factor: 4.0    # Radial boost factor for high frequencies

scheduler:
  type: "CosineAnnealingLR"
  eta_min: 1e-6
