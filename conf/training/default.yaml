epochs: 100
batch_size: 4
num_workers: 4
learning_rate: 2e-4
weight_decay: 1e-4

matmul_precision: "high"

loss:
  amp_loss_type: "l1"
  phase_loss_type: "l1"
  lambda_phase: 1.0
  lambda_hf: 0.0          # High-frequency k-space boost weight (disabled by default)
  hf_boost_factor: 4.0    # Radial boost factor for high frequencies

scheduler:
  type: "CosineAnnealingLR"
  eta_min: 1e-6
