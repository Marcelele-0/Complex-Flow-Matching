# 2.5D U-Net: shared 2D encoders per slice, fused by cross-slice attention at the
# bottleneck, then a 2D decoder on the center slice only.
#
# REQUIRES an odd dataset.num_slices > 1, since the model consumes slice windows:
#   uv run src/cfm/train.py model=c_unet_cross_slice dataset.num_slices=3
# train.py fails fast if this is not set.
#
# Sampling is NOT wired yet: the model emits a center-only velocity, which the ODE
# solver cannot use to advance a multi-slice state. evaluate.py
# raises NotImplementedError for this model.
#
# Memory: the encoder runs on batch_size * num_slices images, so expect to roughly
# halve batch_size relative to c_unet_attention at num_slices=3. Measure rather
# than assume: the bottleneck is cheaper here (cross-slice attention is O(S^2) per
# position vs O((h*w)^2) for the baseline's spatial self-attention).
base_channels: 96
channel_mults: [1, 2, 4, 8, 8]
attn_heads: 4
name: "c_unet_cross_slice"
