# Generative evaluation. Every metric here is distributional: synthesis has no
# paired target, so PSNR and SSIM against "the" slice are meaningless by
# construction, which is why the paired path was removed rather than reused.

# How many fields to draw and to compare against. Coefficients are pooled, so a
# 64x64 field contributes 4096 points and a few dozen fields already saturate the
# marginal estimators; raise this when the fields are small or the metric is noisy.
num_fields: 64
batch_size: 16
num_workers: 0

# Solver step counts to sweep. The claim this project makes about how few steps a
# geometry needs is read off this table, so the low end matters more than the high.
nfe: [1, 2, 4, 8, 16, 32, 64, 100]

# Random directions averaged by the sliced estimator. More is cheaper than more
# samples and reduces its variance; 256 is where the returns flatten here.
num_projections: 256

# Fixed so a reported number can be reproduced: this seeds the prior draw, the
# projections, the time sample and any subsampling.
seed: 0

# Checkpoint lookup: outputs/train/{run_name}/**/*.pt, newest by mtime.
# Falls back to logging.experiment_name when null.
run_name: ~
checkpoint_path: ~
