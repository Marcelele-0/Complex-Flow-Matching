# @package _global_
# Table 1 -- peak angular velocity of the analytic bridges. No network.
#
# 10^6 endpoint pairs, copula target rho = 0.5, minibatch OT on scalar pairs with
# batch 256, seed 0. The Cartesian chord uses its exact closed form, checked against a
# 20001-point time grid. Deterministic: a rerun prints the same numbers.
#
#   uv run python scripts/paper/reproduce.py table1_bridges
paper:
  name: Table 1 -- analytical path geometry
  section: Table 1 (Section 5.1)
  runtime: ~15 s on CPU
  kind: commands
  commands:
    - [scripts/bridge_angular_velocity.py]
  expected: |
    Cartesian / independent   median 2.814   q99.9 1565.655   > pi 46.0%
    Cartesian / minibatch OT  median 0.314   q99.9   26.716   > pi  1.0%
    Cylindrical / independent median 1.570   q99.9    3.138   > pi  0.0%
    tail index (Hill, top 1%): Cartesian / independent 1.006
