# @package _global_
# The training protocol behind Table 6: LibriSpeech complex STFT segments.
#
# The audio counterpart of `table5_fastmri`, and deliberately the same protocol: same
# objective, same schedule, same evaluation, on a second domain. Geometry, coupling and
# seed are chosen on the command line:
#
#   uv run python -m cfm.train +experiment=table6_audio \
#       manifold=cylindrical training.coupling=ot training.seed=0 \
#       logging.experiment_name=t6_cylindrical_ot_s0
#   uv run python -m cfm.evaluate +experiment=table6_audio \
#       manifold=cylindrical training.coupling=ot dataset.role=holdout \
#       evaluate.run_name=t6_cylindrical_ot_s0 evaluate.nfe=[1,2,4,8,100]
#
# This exists rather than reusing `paper_unet` because that config carries a `dataset:`
# block for the synthetic cohort -- `size` and `coupling` -- which StftStoreDataset does
# not accept, and build_dataset rejects unknown keys rather than ignoring them.
#
# Split. One store, hashed by SPEAKER into fit and holdout: segments of one utterance
# share a voice, a room and a microphone, and one speaker reads many utterances, so
# anything finer leaks. Unlike fastMRI there is no ready-made disjoint pair of cohorts,
# so dev-clean and test-clean are pooled and split here instead. Measured on the built
# store: 110099 segments from 59 voices against 39053 from 21, with no voice in both.
#
# Scale. The store holds ~149k segments against the knee store's 4653 slices, so an
# epoch here is thirty times an epoch there. `epochs` is set for parity of optimisation
# steps rather than of passes; revisit when Table 6 is budgeted, and say plainly in the
# paper which of the two was held fixed, because "more data on one side" is not a
# neutral choice in a comparison between domains.
defaults:
  - override /dataset: librispeech_stft
  - override /model: c_unet

dataset:
  role: fit
  holdout_fraction: 0.2
  split_seed: 0

training:
  bridge: noise
  epochs: 2
  batch_size: 64
  grad_clip: null
  compile: false
  loss:
    amp_loss_type: l2
    phase_loss_type: l2
    phase_amplitude_weighting: false
    vel_loss_type: l2

evaluate:
  # 64x64 segments are the synthetic cohort's size, so the default batching applies.
  straightness_batch_size: 64
  batch_size: 64

logging:
  use_wandb: false
