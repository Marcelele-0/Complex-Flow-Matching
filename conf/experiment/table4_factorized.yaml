# @package _global_
# Table 4 and Section 5.4 -- the Factorized Coupling Trap. No network.
#
# Part 1 (Table 4): amplitude and phase coupled independently, spiral copula target,
# n = 1024, 8 seeds. Part 2 (the patch seams): section 5 of the output of
# coupling_dimension.py, 64x64 fields, correlation length 6, 16x16 patches. Every
# draw is seeded through an explicit torch.Generator.
#
#   uv run python scripts/paper/reproduce.py table4_factorized
paper:
  name: Table 4 -- the Factorized Coupling Trap
  section: Table 4 and Section 5.4
  runtime: ~4 min on CPU
  kind: commands
  make_dirs: [outputs/paper]
  commands:
    - [scripts/coupling_gate.py, --samples, "1024", --seeds, "8", --plot, outputs/paper/gate_a.png]
    - [scripts/coupling_dimension.py]
  expected: |
    spiral rows of Table 4:
      rho 0.0  r_cl target 0.0242  coupled 0.0417  KS 0  cost factorised 0.1996  joint 0.2055
      rho 0.5  r_cl target 0.3104  coupled 0.0415  KS 0  cost factorised 0.1999  joint 0.2248
      rho 1.0  r_cl target 0.8670  coupled 0.0396  KS 0  cost factorised 0.2001  joint 0.3845
    patch seams:
      patch-level OT  lag1 across seams 0.044  inside patches 0.979  sliced W2 0.0000
