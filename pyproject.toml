[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfm"]

[project]
name = "cfm"
version = "0.1.0"
description = "Complex Flow Matching for MRI synthesis on cylindrical manifolds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.8",
    "nibabel>=5.4.2",
    "numpy>=2.4.4",
    "torch>=2.11.0",
    "torchdiffeq>=0.2.5",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "wandb>=0.25.1",
]

[project.optional-dependencies]
# Only scripts/prep_fastmri_espirit.py needs sigpy, and only when generating the
# ESPIRiT maps. Nothing under src/ imports it, so training installs should not have
# to pull in numba and llvmlite. Install with: uv sync --extra espirit
espirit = [
    "sigpy>=0.1.27",
]

[dependency-groups]
dev = [
    "sigpy>=0.1.27",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "jupytext>=1.16.0",
    "manim>=0.21.0",
    "mypy>=2.3.1",
    "plotly>=6.6.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.16.5",
    "types-tqdm>=4.70.0.20260827",
    "wandb>=0.25.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["cfm"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.py" = ["E402", "B018"]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
