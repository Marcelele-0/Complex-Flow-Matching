[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyfm"]

[project]
name = "cyfm"
version = "0.1.0"
description = "Cylindrical Flow Matching: generative flow matching for complex-valued fields on the cylinder, with the couplings, bridges and structural metrics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Marcel Musialek" },
    { name = "Iga Wolanin" },
    { name = "Damian Ryczko" },
    { name = "Anna Grelewska" },
    { name = "Oleksii Furman" },
]

# The acronym is what the paper uses and what a citation will carry, but nobody searching
# for "cylindrical flow matching" would find it, so the full phrase lives here where
# PyPI's search reads it. No alias package: an empty pointer is a dead entry forever.
keywords = [
    "cylindrical flow matching",
    "complex flow matching",
    "flow matching",
    "generative model",
    "optimal transport",
    "complex-valued",
    "phase",
    "MRI",
    "STFT",
]

# No "License ::" classifier: with PEP 639 the SPDX expression above is the license
# declaration, and repeating it as a classifier is rejected by modern backends.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

# What `import cyfm` needs TODAY. Four of these are here only because the import graph
# is still eager, and they leave once it is not:
#   h5py          - cyfm/data/__init__.py imports every store module at package import
#   hydra-core    - cyfm.manifolds.build_manifold reads a DictConfig, and cyfm/__init__
#                   imports cyfm.manifolds (omegaconf arrives with hydra-core)
#   tqdm          - cyfm/train.py only
#   python-dotenv - cyfm/data/download.py only
# torch, numpy and scipy are the real core: scipy carries linear_sum_assignment, which
# is the exact minibatch OT assignment the method is built on, not a convenience.
dependencies = [
    "torch>=2.11.0",
    "numpy>=2.4.4",
    "scipy>=1.15.0",
    "h5py>=3.16.0",
    "hydra-core>=1.3.2",
    "tqdm>=4.67.3",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
# Real-data intake. ESPIRiT here combines coils into one complex field; it is data
# preparation for synthesis, not reconstruction from undersampled measurements.
mri = [
    "huggingface-hub>=1.30.0",
]
fastmri = [
    "fastmri>=0.3.0",
]
# Only scripts/prep_fastmri_espirit.py needs sigpy, and only when generating the
# ESPIRiT maps. Nothing under src/ imports it, so training installs should not have
# to pull in numba and llvmlite. Install with: uv sync --extra espirit
espirit = [
    "sigpy>=0.1.27",
]
audio = [
    "soundfile>=0.13.1",
]
logging = [
    "wandb>=0.25.1",
]
# Figure generation only: the sample panels and the diagnostic plots the network-free
# probes draw. Kept out of the default groups so a training install stays small.
viz = [
    "matplotlib>=3.10.8",
]

[dependency-groups]
# Building the API reference. Its own group rather than `dev`: the site is built
# on demand and in CI, and a contributor running the test suite should not have
# to install a documentation toolchain to do it.
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.27.0",
]
# What a contributor needs to run the suite, the linters and the repository's scripts.
# nibabel is reached by exactly one test.
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "pre-commit>=4.5.0",
    "types-tqdm>=4.70.0.20260827",
    "matplotlib>=3.10.8",
    "nibabel>=5.4.2",
    "sigpy>=0.1.27",
    "soundfile>=0.13.1",
    "wandb>=0.25.1",
    "huggingface-hub>=1.30.0",
]
[tool.pytest.ini_options]
# The repository root, so `reproducibility/` is importable from the suite. It is
# deliberately not part of the wheel -- it reproduces the paper, which is a
# property of this repository rather than of the library -- so nothing else puts
# it on the path.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "data",
]

[tool.ruff.lint]
# D is on, with the Google convention: every public module, class and function
# carries a docstring, and the sections are the ones mkdocstrings renders.
#
# Two rules are off, and for the same reason: they flag places this codebase
# documents somewhere else rather than not at all.
#   D107  the constructor's arguments are documented in the class docstring,
#         which is what the Google style guide itself allows and what every
#         class here does.
#   D105  a magic method's contract is fixed by the protocol it implements;
#         __len__ and __repr__ gain nothing from a sentence restating it.
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D107", "D105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are named as sentences -- test_the_cylinder_reads_the_bounded_coordinate --
# and that name is the documentation. Requiring a docstring alongside it produces a
# restatement, and the ones worth writing (why a case exists, what defect it pins)
# are written already, because nothing forced them. The module docstrings stay
# required; it is the per-function rules that are off.
"tests/**" = ["D101", "D102", "D103"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["cyfm"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

# Deliberately no [project.scripts]. The blueprint called for a `cyfm-reproduce`
# console script, and it was declared and then removed: `reproducibility/` is a
# property of the repository rather than of the library, so it is not in the
# wheel, and the entry point resolved to a module an installed wheel does not
# have. Shipping it instead would claim the top-level name `reproducibility` on
# the user's system, which a package called `cyfm` has no business doing.
# A reviewer clones the repo and runs `python -m reproducibility.run_all`, which
# is how every other paper script here is invoked.

[project.urls]
Homepage = "https://github.com/Marcelele-0/Complex-Flow-Matching"
Repository = "https://github.com/Marcelele-0/Complex-Flow-Matching"
Issues = "https://github.com/Marcelele-0/Complex-Flow-Matching/issues"

