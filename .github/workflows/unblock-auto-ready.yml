name: Auto-Advance Unblocked Issues to Ready

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]

jobs:
  unblock-tasks:
    if: github.event.issue.state == 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: read
      repository-projects: write
    steps:
      - name: Check and Advance Dependent Issues to Ready
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const projectId = "PVT_kwHOCOGYJc4BfQt3";
            const fieldStatus = "PVTSSF_lAHOCOGYJc4BfQt3zhZk1_Y";
            const optStatusReady = "61e4505c";

            console.log(`Checking blocked issues in ${owner}/${repo}...`);

            const query = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  issues(states: OPEN, first: 100) {
                    nodes {
                      id
                      number
                      title
                      projectItems(first: 5) {
                        nodes {
                          id
                          project {
                            id
                          }
                        }
                      }
                      blockedBy(first: 10) {
                        nodes {
                          number
                          state
                        }
                      }
                    }
                  }
                }
              }
            `;

            try {
              const result = await github.graphql(query, { owner, repo });
              const openIssues = result.repository.issues.nodes;

              for (const issue of openIssues) {
                const blockers = issue.blockedBy.nodes;
                if (blockers.length === 0) continue;

                const hasOpenBlocker = blockers.some(b => b.state === 'OPEN');
                if (!hasOpenBlocker) {
                  console.log(`🎉 Issue #${issue.number} is now UNBLOCKED!`);
                  const projectItem = issue.projectItems.nodes.find(p => p.project.id === projectId);
                  if (projectItem) {
                    const updateMutation = `
                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                        updateProjectV2ItemFieldValue(input: {
                          projectId: $projectId
                          itemId: $itemId
                          fieldId: $fieldId
                          value: { singleSelectOptionId: $optionId }
                        }) {
                          projectV2Item { id }
                        }
                      }
                    `;
                    await github.graphql(updateMutation, {
                      projectId,
                      itemId: projectItem.id,
                      fieldId: fieldStatus,
                      optionId: optStatusReady
                    });
                    console.log(`Moved Issue #${issue.number} to READY!`);
                  }
                }
              }
            } catch (err) {
              console.log(`Workflow notice: ${err.message}`);
            }
